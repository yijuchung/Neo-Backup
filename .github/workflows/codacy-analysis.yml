# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      #
      # continue-on-error: the action fetches its CLI over the network from
      # raw.githubusercontent.com, which intermittently returns "429 Too Many
      # Requests" and fails the whole job. Codacy is advisory here (PR rejection
      # is handed to GitHub code scanning via the uploaded SARIF and
      # max-allowed-issues below), so a transient infrastructure hiccup must not
      # turn the PR red. When the scan succeeds the SARIF is still uploaded.
      - name: Run Codacy Analysis CLI
        id: codacy
        continue-on-error: true
        uses: codacy/codacy-analysis-cli-action@v4.4.7
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Upload the SARIF file generated in the previous step, but only when it was
      # actually produced (skipped when the scan step failed to generate results).
      #
      # Codacy emits one SARIF "run" per tool, all sharing an empty category, and
      # github/codeql-action/upload-sarif rejects "multiple SARIF runs with the
      # same category" (see the 2025-07-21 code scanning changelog). Give each run
      # a unique automationDetails.id so every category maps to a single run. jq is
      # preinstalled on ubuntu-latest. If the file isn't valid JSON (e.g. the scan
      # only partially ran) we leave it untouched and let the guarded upload skip.
      - name: Normalize SARIF categories
        if: ${{ hashFiles('results.sarif') != '' }}
        run: |
          if jq -e . results.sarif >/dev/null 2>&1; then
            jq '.runs |= [ to_entries[] | .value.automationDetails.id = ((.value.tool.driver.name // "codacy") + "-" + (.key|tostring)) | .value ]' \
              results.sarif > results.normalized.sarif
            mv results.normalized.sarif results.sarif
            echo "Normalized $(jq '.runs | length' results.sarif) SARIF run(s) to unique categories."
          else
            echo "results.sarif is not valid JSON; leaving it untouched."
          fi

      # Upload is advisory: matching the max-allowed-issues policy above, a failure
      # to surface Codacy results must not turn the PR red.
      - name: Upload SARIF results file
        if: ${{ hashFiles('results.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
