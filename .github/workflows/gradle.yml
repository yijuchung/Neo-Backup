# Builds the app and runs the local JVM unit tests on every push / PR.
# See: https://docs.github.com/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Main CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform
        run: sdkmanager "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Runs the fast JVM unit tests (security-critical quoting / path-traversal /
      # key-derivation checks), enforces the coverage gate, then compiles release sources.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Fails the build if line coverage of the security-critical modules drops below the
      # threshold configured in build.gradle.kts (kover { ... minBound(85) }).
      - name: Verify security-module coverage gate
        run: ./gradlew koverXmlReportDebug koverVerifyDebug --stacktrace

      - name: Compile release sources
        run: ./gradlew compileReleaseSources --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-report
          path: build/reports/kover
          if-no-files-found: ignore
