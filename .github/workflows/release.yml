# Builds a signed APK and publishes a GitHub Release when a fork version tag
# (e.g. v1.0.0) is pushed. Runs the security-critical JVM unit tests first as a gate.
#
# Signing (optional): add these repository secrets to get a signed *release* APK,
# otherwise the workflow falls back to a debug-signed APK so a tag always yields an
# installable artifact:
#   KEYSTORE_BASE64   - base64 of your release keystore (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD - keystore (store) password
#   KEY_ALIAS         - key alias
#   KEY_PASSWORD      - key password

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform
        run: sdkmanager "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Determine signing availability
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret set - building a debug-signed APK. Add signing secrets for a release APK."
          fi

      - name: Decode keystore and write signing config
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK (signed)
        if: steps.signing.outputs.enabled == 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Build debug APK (fallback, no signing secrets)
        if: steps.signing.outputs.enabled != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          apk=$(find build/outputs/apk -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "No APK found under build/outputs/apk" >&2
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "Found APK: $apk"

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^[0-9]+\.[0-9]+\.[0-9]+/ {
              if (index($0, v) == 1) { started=1; print; next }
              else if (started) { exit }
            }
            started { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release $GITHUB_REF_NAME" > release_notes.md
          fi
          echo "----- release notes -----"
          cat release_notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-backup-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Neo Backup ${{ github.ref_name }}
          body_path: release_notes.md
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
